apiVersion: v1
kind: Service
metadata:
  name: drug-recommendation-service
  namespace: drug-recommendation
  labels:
    app: drug-recommendation
spec:
  type: NodePort
  selector:
    app: drug-recommendation
  ports:
  - name: http
    protocol: TCP
    port: 5000
    targetPort: 5000
    nodePort: 30080
  sessionAffinity: None

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: drug-recommendation-config
  namespace: drug-recommendation
data:
  FLASK_ENV: "production"
  PYTHONUNBUFFERED: "1"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drug-recommendation-sa
  namespace: drug-recommendation
  labels:
    app: drug-recommendation

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drug-recommendation-role
  namespace: drug-recommendation
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drug-recommendation-rolebinding
  namespace: drug-recommendation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: drug-recommendation-role
subjects:
- kind: ServiceAccount
  name: drug-recommendation-sa
  namespace: drug-recommendation

---
apiVersion: v1
kind: NetworkPolicy
metadata:
  name: drug-recommendation-netpol
  namespace: drug-recommendation
spec:
  podSelector:
    matchLabels:
      app: drug-recommendation
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: drug-recommendation
    ports:
    - protocol: TCP
      port: 5000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
