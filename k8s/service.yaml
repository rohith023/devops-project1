apiVersion: v1
kind: Service
metadata:
  name: drug-recommendation-service
  namespace: drug-recommendation
  labels:
    app: drug-recommendation
spec:
  type: NodePort
  selector:
    app: drug-recommendation
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: drug-recommendation-lb
  namespace: drug-recommendation
  labels:
    app: drug-recommendation
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: drug-recommendation
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
