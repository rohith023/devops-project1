<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drug Recommendation API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .prediction-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            margin-bottom: 15px;
        }
        .drug-name {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 8px;
        }
        .confidence {
            font-size: 14px;
            color: #666;
        }
        .error {
            background: #fee;
            border-left-color: #f00;
            color: #c00;
        }
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }
        .api-info {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #0277bd;
            border-left: 4px solid #0277bd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💊 Drug Recommendation</h1>
        <p class="subtitle">Cloud-Native ML Prediction System</p>
        
        <div class="api-info">
            ✓ API Running on <strong>localhost:5001</strong><br>
            ✓ Model Loaded with 97.78% Accuracy
        </div>

        <form id="predictionForm">
            <div class="form-group">
                <label for="age">Age (years)</label>
                <input type="number" id="age" name="age" min="0" max="150" value="45" required>
            </div>

            <div class="form-group">
                <label for="bp">Blood Pressure</label>
                <select id="bp" name="bp" required>
                    <option value="">Select BP Level</option>
                    <option value="LOW">LOW</option>
                    <option value="NORMAL">NORMAL</option>
                    <option value="HIGH" selected>HIGH</option>
                </select>
            </div>

            <div class="form-group">
                <label for="cholesterol">Cholesterol</label>
                <select id="cholesterol" name="cholesterol" required>
                    <option value="">Select Cholesterol Level</option>
                    <option value="LOW">LOW</option>
                    <option value="NORMAL">NORMAL</option>
                    <option value="HIGH" selected>HIGH</option>
                </select>
            </div>

            <div class="loading" id="loading">⏳ Processing...</div>
            <button type="submit">Get Drug Recommendation</button>
        </form>

        <div class="result" id="result"></div>
    </div>

    <script>
        const form = document.getElementById('predictionForm');
        const resultDiv = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const age = document.getElementById('age').value;
            const bp = document.getElementById('bp').value;
            const cholesterol = document.getElementById('cholesterol').value;

            loadingDiv.style.display = 'block';
            resultDiv.classList.remove('show');

            try {
                const response = await fetch('http://localhost:5001/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        age: parseInt(age),
                        bp: bp,
                        cholesterol: cholesterol
                    })
                });

                const data = await response.json();

                loadingDiv.style.display = 'none';

                if (response.ok) {
                    const prediction = data.prediction;
                    resultDiv.innerHTML = `
                        <h3>✓ Prediction Result</h3>
                        <div class="prediction-box">
                            <div class="drug-name">${prediction.drug}</div>
                            <div class="confidence">
                                Confidence: <strong>${(prediction.confidence * 100).toFixed(1)}%</strong>
                            </div>
                        </div>
                        <div style="font-size: 13px; color: #666;">
                            <strong>Input:</strong><br>
                            Age: ${age} years<br>
                            BP: ${bp} | Cholesterol: ${cholesterol}<br>
                            <br>
                            <strong>Timestamp:</strong> ${new Date(data.timestamp).toLocaleString()}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h3>✗ Error</h3>
                        <div class="prediction-box error">
                            ${data.message || 'Failed to get prediction'}
                        </div>
                    `;
                }

                resultDiv.classList.add('show');
            } catch (error) {
                loadingDiv.style.display = 'none';
                resultDiv.innerHTML = `
                    <h3>✗ Connection Error</h3>
                    <div class="prediction-box error">
                        Cannot connect to API. Make sure Docker is running on port 5001.<br>
                        Error: ${error.message}
                    </div>
                `;
                resultDiv.classList.add('show');
            }
        });
    </script>
</body>
</html>
