---
- name: Deploy Drug Recommendation App
  hosts: all
  become: yes
  roles:
    - app

  tasks:
    - name: Create app directory
      file:
        path: /opt/drug-app
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy application files
      synchronize:
        src: ../
        dest: /opt/drug-app/
        delete: yes
        recursive: yes
      when: inventory_hostname == groups['app'][0]

    - name: Build Docker image
      docker_image:
        name: drug-app
        tag: latest
        path: /opt/drug-app
        build:
          pull: yes
        state: present
        source: build
      when: inventory_hostname == groups['app'][0]

    - name: Run Docker container
      docker_container:
        name: drug-app
        image: drug-app:latest
        state: started
        restart_policy: always
        ports:
          - "5000:5000"
        env:
          FLASK_ENV: production
          PYTHONUNBUFFERED: "1"

    - name: Verify app is running
      uri:
        url: "http://localhost:5000/health"
        status_code: 200
      register: health_check
      until: health_check.status == 200
      retries: 10
      delay: 5
