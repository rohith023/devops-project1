# Ansible Inventory
# Update with your server IPs

[app]
app-server-1 ansible_host=192.168.1.10 ansible_user=ubuntu

[k8s]
k8s-master ansible_host=192.168.1.20 ansible_user=ubuntu
k8s-node-1 ansible_host=192.168.1.21 ansible_user=ubuntu
k8s-node-2 ansible_host=192.168.1.22 ansible_user=ubuntu

[all:vars]
ansible_python_interpreter=/usr/bin/python3
