name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest test_app.py -v

      - name: Verify model
        run: |
          ls -la model.pkl
          python -c "import joblib; m = joblib.load('model.pkl'); print('Model OK:', list(m.keys()))"

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: drug-app:latest

      - name: Verify image
        run: docker images drug-app

      - name: Test container
        run: |
          docker run -d --name test-app -p 5000:5000 drug-app:latest
          sleep 5
          docker ps
          docker logs test-app
          docker stop test-app
          docker rm test-app
